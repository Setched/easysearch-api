spring:
  application:
    name: easysearch-api
  datasource:
    url: jdbc:postgresql://localhost:5432/easysearch
    username: easysearch
    password: easysearch
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

easysearch:
  marketplaces:
    ozon:
      base-url: https://api-seller.ozon.ru
      api-key: ${OZON_API_KEY:}
      client-id: ${OZON_CLIENT_ID:}
      connect-timeout: 2s
      read-timeout: 5s