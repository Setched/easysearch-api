spring:
  application:
    name: easysearch-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:easysearch}
    username: ${DB_USERNAME:easysearch}
    password: ${DB_PASSWORD:easysearch}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

easysearch:
  marketplaces:
    # Ozon's scraper can take 10+ seconds on a cold session (passing its antibot challenge);
    # these are generous enough to let it finish rather than cutting it off mid-flight. Clients
    # run in parallel, so fast marketplaces (Wildberries, Yandex Market) aren't slowed down by
    # this — overall latency is bounded by the slowest client, not the sum.
    search-timeout: 20s
    compare-timeout: 25s
    ozon:
      base-url: ${OZON_SCRAPER_URL:http://localhost:8000}
      connect-timeout: 2s
      read-timeout: 20s