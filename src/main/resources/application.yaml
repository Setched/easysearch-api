spring:
  application:
    name: easysearch-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:easysearch}
    username: ${DB_USERNAME:easysearch}
    password: ${DB_PASSWORD:easysearch}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

easysearch:
  marketplaces:
    # Ozon's scraper can take 10+ seconds on a cold session (passing its antibot challenge);
    # Wildberries' can take up to ~20s (observed 8-20s live, via a headful patchright/real-Chrome
    # session passing Wildberries' WBAAS antibot — see wildberries-scraper/README.md). These are
    # generous enough to let either finish rather than cutting them off mid-flight. Clients run in
    # parallel, so fast marketplaces (Yandex Market) aren't slowed down by this — overall latency
    # is bounded by the slowest client, not the sum.
    search-timeout: 45s
    compare-timeout: 50s
    ozon:
      base-url: ${OZON_SCRAPER_URL:http://localhost:8000}
      connect-timeout: 2s
      read-timeout: 20s
    wildberries:
      base-url: ${WILDBERRIES_SCRAPER_URL:http://localhost:8001}
      connect-timeout: 2s
      read-timeout: 45s