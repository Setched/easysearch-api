services:
  postgres:
    image: postgres:16
    container_name: easysearch-postgres
    environment:
      POSTGRES_DB: easysearch
      POSTGRES_USER: easysearch
      POSTGRES_PASSWORD: easysearch
    ports:
      - "5432:5432"
    volumes:
      - easysearch_postgres_data:/var/lib/postgresql/data

  ozon-scraper:
    build: ./ozon-scraper
    container_name: easysearch-ozon-scraper
    ports:
      - "8000:8000"

volumes:
  easysearch_postgres_data: