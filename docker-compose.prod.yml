services:
  postgres:
    image: postgres:16
    container_name: easysearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: easysearch
      POSTGRES_USER: easysearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - easysearch_postgres_data:/var/lib/postgresql/data

  # Images below are built and published by .github/workflows/ci.yml's build-and-push job, not
  # built here — deploying is "pull + restart" (see .github/workflows/deploy.yml), not a rebuild.
  # IMAGE_TAG defaults to the latest master build; deploy.yml can pin it to a specific commit SHA
  # instead, e.g. to roll back.
  ozon-scraper:
    image: ghcr.io/setched/easysearch-api/ozon-scraper:${IMAGE_TAG:-latest}
    container_name: easysearch-ozon-scraper
    restart: unless-stopped
    # Chromium needs more than Docker's default 64MB /dev/shm or the renderer
    # crashes under normal use, independent of how much RAM the host has free.
    shm_size: "1gb"

  wildberries-scraper:
    image: ghcr.io/setched/easysearch-api/wildberries-scraper:${IMAGE_TAG:-latest}
    container_name: easysearch-wildberries-scraper
    restart: unless-stopped
    shm_size: "1gb"

  yandexmarket-scraper:
    image: ghcr.io/setched/easysearch-api/yandexmarket-scraper:${IMAGE_TAG:-latest}
    container_name: easysearch-yandexmarket-scraper
    restart: unless-stopped

  easysearch-api:
    image: ghcr.io/setched/easysearch-api/app:${IMAGE_TAG:-latest}
    container_name: easysearch-api
    restart: unless-stopped
    depends_on:
      - postgres
      - ozon-scraper
      - wildberries-scraper
      - yandexmarket-scraper
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: easysearch
      DB_USERNAME: easysearch
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OZON_SCRAPER_URL: http://ozon-scraper:8000
      WILDBERRIES_SCRAPER_URL: http://wildberries-scraper:8001
      YANDEXMARKET_SCRAPER_URL: http://yandexmarket-scraper:8002

  caddy:
    image: caddy:2-alpine
    container_name: easysearch-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - easysearch-api

volumes:
  easysearch_postgres_data:
  caddy_data:
  caddy_config:
